<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- No outside requests: no analytics, no CDNs, no fonts. Files stay on this device. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>App Name · Unsubbed</title>
  <meta name="description" content="A free alternative to X. Runs in your browser; your files never leave your device.">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="kit.css">
</head>
<body>
  <header class="u-bar">
    <a class="u-brand" href="./">
      <img src="logo.svg" alt=""><span data-app-name>App Name</span>
    </a>
    <button class="u-btn" data-import title="Open a file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 15V3m0 0-4 4m4-4 4 4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
      <span class="label">Open</span>
    </button>
    <button class="u-btn" data-export title="Save a copy to your device">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
      <span class="label">Save</span>
    </button>
    <button class="u-btn icon" data-settings title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    </button>
    <a class="u-btn support" href="https://unsubbed.org/support" target="_blank" rel="noopener" title="Support development">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>
      <span class="label">Support</span>
    </a>
  </header>

  <main id="app">
    <!-- Each app puts its own interface here. This demo is replaced by the builder. -->
    <div class="u-card">
      <label class="u-field">
        <span>Demo notes. Saved on this device as you type.</span>
        <textarea id="demo" rows="10" placeholder="Type something, then try Save and Open…"></textarea>
      </label>
    </div>
  </main>

  <footer class="u-foot">
    Free forever. <a href="https://unsubbed.org/support" target="_blank" rel="noopener">Support development → unsubbed.org/support</a>
    <br>Open source under AGPL-3.0 · Your files never leave your device.
  </footer>

  <dialog id="u-settings">
    <form method="dialog">
      <h2>Settings</h2>
      <label class="u-field">
        <span>Appearance</span>
        <select name="theme">
          <option value="system">Match my device</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <div id="app-settings"><!-- Apps add their own settings here. --></div>
      <hr>
      <p class="u-note">Everything is stored only in this browser. Clearing it cannot be undone; save a copy first.</p>
      <div class="u-row">
        <button type="button" class="u-btn danger" data-clear>Clear data on this device</button>
        <button class="u-btn primary">Done</button>
      </div>
    </form>
  </dialog>

  <div class="u-toast" role="status" aria-live="polite" hidden></div>

  <script src="kit.js"></script>
  <script src="app.js"></script>
</body>
</html>
